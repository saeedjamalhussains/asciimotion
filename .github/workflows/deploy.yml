name: Deploy

# Builds the static site and publishes it to GitHub Pages.
# The app is fully client-side, so this only ever ships static files.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      actions: write # Needed to delete the previous build artifacts.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # No dependency cache: every commit installs and builds from nothing.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Remove any previous output
        run: rm -rf dist node_modules

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        # Pages must be enabled once in Settings > Pages with the source set
        # to GitHub Actions. The workflow token cannot create the Pages site.
        uses: actions/configure-pages@v5

      # Runs after the build, so a failed build leaves the last good one in place.
      - name: Delete previous build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages" --jq '.artifacts[].id' |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
